  - name: Ashby — SRE & Cloud
    query: 'site:jobs.ashbyhq.com "Site Reliability" OR "SRE" OR "Cloud Engineer" OR "Cloud Operations" remote'
    enabled: true

  - name: Ashby — Solutions Architect
    query: 'site:jobs.ashbyhq.com "Solutions Architect" OR "Cloud Architect" OR "Infrastructure Architect" remote'
    enabled: true

  # -- DevOps / Platform on Greenhouse --
