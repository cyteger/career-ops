# Portal Scanner Configuration
# Customized for: Oswald Gyabaah — Senior DevOps / Platform / Cloud / Infra Engineer
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)

# -- Location filter (v1.8.0+) --
# Case-insensitive substring match. block wins over allow.
# Empty location string passes (don't penalize postings with missing data).
# If allow is non-empty, the posting must hit at least one allow keyword after passing block.
location_filter:
  allow:
    # Universal remote
    - "Remote"
    - "Anywhere"
    - "Worldwide"
    - "Global"
    - "Distributed"
    # Africa (home base + nearby hubs)
    - "Africa"
    - "Ghana"
    - "Accra"
    - "Nigeria"
    - "Lagos"
    - "Kenya"
    - "Nairobi"
    - "South Africa"
    - "Egypt"
    # EMEA / Europe (relocation viable with sponsorship)
    - "EMEA"
    - "EU"
    - "Europe"
    - "European"
    - "Germany"
    - "Berlin"
    - "Netherlands"
    - "Amsterdam"
    - "United Kingdom"
    - "UK"
    - "London"
    - "Ireland"
    - "Dublin"
    - "Portugal"
    - "Lisbon"
    - "Spain"
    - "Barcelona"
    - "Madrid"
    - "France"
    - "Paris"
    - "Sweden"
    - "Stockholm"
    - "Denmark"
    - "Finland"
    - "Switzerland"
    - "Belgium"
    - "Brussels"
    # North America (relocation viable with sponsorship)
    - "United States"
    - "USA"
    - "Canada"
    - "Toronto"
    - "Vancouver"
  block:
    # Strict US-only postings (no Africa-remote, no sponsorship path)
    - "US only"
    - "U.S. only"
    - "US-only"
    - "United States only"
    - "USA only"
    - "US Citizens only"
    - "U.S. citizens only"
    # Country-locked offshore postings (typically delivery centers)
    - "India only"
    - "Brazil only"

title_filter:
  positive:
    # -- DevOps / Platform / Infra --
    - "DevOps"
    - "Platform Engineer"
    - "Infrastructure Engineer"
    - "Cloud Engineer"
    - "Cloud Operations"
    - "Site Reliability"
    - "SRE"
    - "Systems Engineer"
    - "Production Engineer"
    - "Reliability Engineer"
    # -- Kubernetes / Container specific --
    - "Kubernetes"
    - "Container"
    # -- Architecture --
    - "Solutions Architect"
    - "Cloud Architect"
    - "Infrastructure Architect"
    - "Enterprise Architect"
    - "Software Architect"
    - "Systems Architect"
    # -- QA / Quality Engineering --
    - "QA Lead"
    - "QA Manager"
    - "QA Engineer"
    - "SDET"
    - "Quality Assurance"
    - "Quality Engineering"
    - "Test Lead"
    - "Test Manager"
    # -- Related engineering --
    - "Fullstack"
    - "Full-Stack"
    - "Full Stack"
    - "Backend Engineer"
    - "Software Engineer"
    - "Build Engineer"
    - "Release Engineer"
    - "Deployment Engineer"
    # -- Ops / Automation --
    - "Automation Engineer"
    - "GitOps"
    - "CI/CD"
    - "IaC"
  negative:
    - "Junior"
    - "Intern"
    - "iOS"
    - "Android"
    - "Frontend"
    - "React"
    - "PHP"
    - "Ruby"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Salesforce Admin"
    - "SAP "
    - "Oracle EBS"
    - "Mainframe"
    - "COBOL"
    - "Data Analyst"
    - "Data Scientist"
    - "Machine Learning"
    - "ML Engineer"
    - "Game"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head"
    - "Manager"

# -- Search queries --
search_queries:

  # -- DevOps / Platform on Ashby --
  - name: Ashby — DevOps & Platform
    query: 'site:jobs.ashbyhq.com "DevOps Engineer" OR "Platform Engineer" OR "Infrastructure Engineer" remote'
